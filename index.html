<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trivialRANKS</title>
<script>
  // Apply the saved theme before the page draws, so there's no flash.
  (function(){ var p; try{ p = JSON.parse(localStorage.getItem('theme')); }catch(e){}
    p = p || 'system';
    var dark = p === 'dark' || (p === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light'; })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5efe3; --card:#fffdf8; --ink:#1f1c17; --muted:#6f685c; --line:#e3dacb;
    --accent:#2f5d50; --accent-soft:#e2ece6; --warm:#b4532a; --warm-soft:#f6e3d8; --gold:#c99a2e;
    --field:#fffaf0; --chip:#ebe3d4; --soft:#efe8da; --soft2:#ece6da; --grid:#e8e0d2; --faint:#9b9385; --idle:#d8cfbf;
    --surface:#fff; --solid:#1f1c17; --on-solid:#fff; --notice:#fff6e5; --notice-line:#e8c77a;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --paper:#15130f; --card:#1f1c17; --ink:#efe9de; --muted:#a59d8f; --line:#38332a;
    --accent:#3f8a73; --accent-soft:#1d322b; --warm:#e0784a; --warm-soft:#3a2519; --gold:#d4a73a;
    --field:#27231c; --chip:#2b2720; --soft:#322d24; --soft2:#2e2a22; --grid:#36312a; --faint:#7d7568; --idle:#4a443a;
    --surface:#1f1c17; --solid:#efe9de; --on-solid:#1f1c17; --notice:#2e2616; --notice-line:#6b5726;
    color-scheme:dark;
  }
  html,body{transition:background .2s}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
  h1{font-family:Fraunces,serif;font-weight:800;font-size:30px;line-height:1;margin:0;letter-spacing:-.5px}
  h1 span{color:var(--warm)}
  .date{color:var(--muted);font-size:13px;margin-top:4px}
  h2{font-family:Fraunces,serif;font-weight:600;font-size:19px;margin:0 0 10px}
  h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;margin:0;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;border:0;cursor:pointer;font-family:inherit}
  .status{font-size:12.5px;color:var(--muted)}
  .status.warn{color:var(--warm)}
  textarea{width:100%;min-height:92px;border:2px dashed var(--line);border-radius:12px;padding:12px;font:14px/1.4 Inter,sans-serif;background:var(--field);color:var(--ink);resize:vertical}
  textarea:focus{outline:none;border-color:var(--accent);border-style:solid}
  .row{display:flex;gap:8px;align-items:center}
  .between{justify-content:space-between}
  .grow{flex:1;min-width:0}
  button.btn{border:0;border-radius:10px;padding:10px 14px;font:600 14px Inter,sans-serif;cursor:pointer;background:var(--accent);color:#fff}
  button.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  button.btn:disabled{opacity:.45;cursor:default}
  .hint{font-size:12.5px;color:var(--muted);margin-top:8px}
  .confirm{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .confirm.bad{border-color:var(--warm);box-shadow:0 0 0 3px var(--warm-soft)}
  .big{font-family:Fraunces,serif;font-weight:800;font-size:34px;line-height:1.1}
  .meta{color:var(--muted);font-size:13px}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
  .badge.beta{background:var(--warm-soft);color:var(--warm)}
  .badge.bonus{background:var(--soft2);color:var(--muted)}
  .cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
  .cat i{width:10px;height:10px;border-radius:50%;display:inline-block}
  nav{display:flex;gap:6px;margin:4px 0 14px;background:var(--chip);padding:4px;border-radius:12px}
  nav button{flex:1;border:0;background:transparent;padding:9px 0;border-radius:9px;font:600 14px Inter,sans-serif;color:var(--muted);cursor:pointer}
  nav button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px}
  .seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font:600 12.5px Inter,sans-serif;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .list{display:flex;flex-direction:column}
  .li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .li:first-child{border-top:0}
  .li.click{cursor:pointer}
  .li.sel{background:linear-gradient(90deg,var(--accent-soft),transparent);margin:0 -14px;padding-left:14px;padding-right:14px}
  .rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--soft);color:var(--muted);flex:none}
  .rank.r1{background:var(--gold);color:#fff}
  .name{font-weight:600}
  .me .name::after{content:" (you)";font-weight:400;color:var(--muted)}
  .score{font-weight:700;font-variant-numeric:tabular-nums}
  .sub{font-size:12px;color:var(--muted)}
  .game{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .game:first-child{border-top:0}
  .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:800;font-family:Fraunces,serif;color:#fff}
  .dot.todo{background:var(--surface)!important;border:2px solid currentColor}
  a.play{text-decoration:none;background:var(--solid);color:var(--on-solid);border-radius:9px;padding:8px 12px;font-weight:600;font-size:13.5px;white-space:nowrap}
  a.play.done{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .catblock{border-left:5px solid;padding-left:12px;margin:14px 0 4px}
  .catblock:first-child{margin-top:4px}
  .progress{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}
  .progress div{height:100%;background:var(--accent);border-radius:99px}
  .empty{color:var(--muted);font-size:14px;padding:6px 0}
  .namebox input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:15px Inter,sans-serif;background:var(--field)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px}
  .cattable{width:100%;border-collapse:collapse;margin-top:6px;font-size:13.5px}
  .cattable td{padding:5px 0;border-top:1px solid var(--line)}
  .cattable td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .stack{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}
  .stack>div{display:flex;height:100%}
  .stack i{display:block;height:100%;min-width:2px;box-shadow:inset -1.5px 0 var(--card)}
  .stack i:last-child{box-shadow:none}
  .track{position:relative;height:20px;margin:10px 8px 2px}
  .track::before{content:"";position:absolute;left:-8px;right:-8px;top:9px;height:2px;border-radius:2px;background:var(--grid)}
  .track b{position:absolute;top:10px;width:9px;height:9px;border-radius:50%;background:var(--faint);opacity:.6;transform:translate(-50%,-50%)}
  .track b.big{width:16px;height:16px;opacity:1;border:2.5px solid var(--card);box-shadow:0 0 0 1px var(--line);z-index:1}
  .track em{position:absolute;top:-7px;transform:translateX(-50%);font:700 9.5px/1 Inter,sans-serif;font-style:normal;color:var(--muted)}
  .boards{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;scrollbar-width:none}
  .boards .chip{flex:none;background:var(--chip);color:var(--muted);padding:6px 12px}
  .boards .chip.on{background:var(--accent);color:#fff}
  .boards .chip.add{background:transparent;border:1px dashed var(--line)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>trivial<span>RANKS</span></h1>
      <div class="date" id="dateLine"></div>
    </div>
    <div class="row" style="gap:6px">
      <button class="chip" id="statsBtn" aria-label="History and stats"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
      <button class="chip" id="nameChip" aria-label="Your profile"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</button>
    </div>
  </header>

  <div class="card namebox" id="nameBox" hidden>
    <h2>What should we call you?</h2>
    <div class="row">
      <input id="nameInput" maxlength="24" placeholder="Your name on the board">
      <button class="btn" id="nameSave">Save</button>
    </div>
    <div class="hint">Shown to everyone on this board.</div>
  </div>

  <div class="card confirm" id="joinCard" hidden></div>

  <div class="card" id="pasteCard">
    <div class="row between" style="margin-bottom:8px">
      <h2 style="margin:0">Log a result</h2>
      <span class="status" id="conn">Connecting…</span>
    </div>
    <div id="pasteBody">
      <textarea id="pasteBox" placeholder="Tap Share in the game, come back, then long-press here and choose Paste."></textarea>
      <div class="hint">Paste from any game; the board works out which one it is.</div>
    </div>
    <button class="btn ghost" id="pasteOpen" hidden style="width:100%">+ Paste another result</button>
  </div>

  <div class="card confirm" id="confirm" hidden></div>

  <div class="card" id="demoBar" style="padding:10px 14px;display:flex;align-items:center;gap:10px"></div>

  <div class="boards" id="boardBar" hidden></div>

  <nav>
    <button data-tab="today" class="on">Today</button>
    <button data-tab="games">Games</button>
    <button data-tab="week">This week</button>
  </nav>

  <section id="tab-today"></section>
  <section id="tab-games" hidden></section>
  <section id="tab-week" hidden></section>
  <section id="page" hidden></section>
</div>

<script>
/* ---------- Categories ---------- */
const CATS = [
  {id:'words',  name:'Words',             short:'Words',   color:'#127a7a'},
  {id:'places', name:'Places',            short:'Places',  color:'#2563b8'},
  {id:'screen', name:'Screen & Sound',    short:'Screen',  color:'#c2408a'},
  {id:'history',name:'History',           short:'History', color:'#c98a16'},
  {id:'sports', name:'Sports',            short:'Sports',  color:'#e06a1b'},
  {id:'gen',    name:'General Knowledge', short:'General', color:'#6d4bb3'},
];
const C = Object.fromEntries(CATS.map(c => [c.id, c]));

/* ---------- Games ----------
   higher: bigger score is better. max: best possible (points games).
   Guess games: best (default 1) and fail = score stored for a miss. */
const GAMES = [
  {id:'wordle',     name:'Wordle',          cat:'words',  url:'https://www.nytimes.com/games/wordle/index.html', higher:false, fail:7, verified:true},
  {id:'quordle',    name:'Quordle',         cat:'words',  url:'https://www.merriam-webster.com/games/quordle', higher:false, best:10, fail:40},
  {id:'octordle',   name:'Octordle',        cat:'words',  url:'https://octordle.com',           higher:false, best:36, fail:112},
  {id:'waffle',     name:'Waffle',          cat:'words',  url:'https://wafflegame.net',         higher:true,  max:5,     keys:['waffle']},
  {id:'maptap',     name:'MapTap',          cat:'places', url:'https://maptap.gg',              higher:true,  max:1000,  verified:true},
  {id:'worldle',    name:'Worldle',         cat:'places', url:'https://worldle.teuteuf.fr',     higher:false, fail:7,    keys:['worldle']},
  {id:'globle',     name:'Globle',          cat:'places', url:'https://globle-game.com',        higher:false, fail:30,   keys:['globle']},
  {id:'travle',     name:'Travle',          cat:'places', url:'https://travle.earth',           higher:false, fail:20,   keys:['travle']},
  {id:'framed',     name:'Framed',          cat:'screen', url:'https://framed.wtf',             higher:false, fail:7,    keys:['framed']},
  {id:'bandle',     name:'Bandle',          cat:'screen', url:'https://bandle.app',             higher:false, fail:7,    keys:['bandle']},
  {id:'actorle',    name:'Actorle',         cat:'screen', url:'https://actorle.com',            higher:false, fail:9,    keys:['actorle']},
  {id:'artle',      name:'Artle',           cat:'screen', url:'https://www.nga.gov/artle.html', higher:false, fail:5,    keys:['artle']},
  {id:'timeguessr', name:'TimeGuessr',      cat:'history', url:'https://timeguessr.com',         higher:true,  max:50000, keys:['timeguessr']},
  {id:'immaculate', name:'Immaculate Grid', short:'Imm. Grid', cat:'sports', url:'https://www.immaculategrid.com', higher:true, max:9, keys:['immaculate grid','immaculategrid']},
  {id:'catfishing', name:'Catfishing',      cat:'gen',    url:'https://catfishing.net',         higher:true,  max:10,    verified:true},
  {id:'krillion',   name:'Krillion',        cat:'gen',    url:'https://krillion.io',            higher:true,  max:700,   keys:['krillion']},
];
const G = Object.fromEntries(GAMES.map(g => [g.id, g]));
// Every game counts toward the day's total. A game takes its category's color.
const gameColor = gid => C[G[gid].cat].color;
const catBadge = gid => `<span class="badge" style="background:${gameColor(gid)};color:#fff">${esc(C[G[gid].cat].name)}</span>`;
const ord = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]); };
// Shared places for a sorted list: equal values share a place (1, 2, 2, 4).
function placesOf(list, val){ const out = []; list.forEach((x, i) => out.push(i && val(list[i-1]) === val(x) ? out[i-1] : i + 1)); return out; }

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2,'0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoLocal(new Date());
function addDays(iso, n){ const d = new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a, b){ return Math.round((Date.parse(b+'T12:00:00Z') - Date.parse(a+'T12:00:00Z'))/864e5); }
const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function prettyDay(iso){ const d = new Date(iso+'T12:00:00'); return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}); }

/* ---------- Parsers ---------- */
function parseWordle(t){
  const m = t.match(/Wordle\s+([\d,.]+)\s+([1-6X])\/6(\*)?/i);
  if(!m) return null;
  const n = +m[1].replace(/[,.]/g,'');
  const fail = m[2].toUpperCase()==='X';
  return {game:'wordle', puzzle:'#'+n, day:addDays('2021-06-19', n),
          score: fail ? 7 : +m[2], display: (fail?'X':m[2])+'/6'+(m[3]?' (hard)':''), verified:true};
}
function parseMapTap(t){
  if(!/maptap\.gg/i.test(t)) return null;
  const fm = t.match(/Final score:\s*([\d,]+)/i);
  if(!fm) return null;
  const score = +fm[1].replace(/,/g,'');
  let day = today(), puzzle = '', rounds = [];
  const dm = t.match(/maptap\.gg\s+([A-Za-z]+)\s+(\d{1,2})/i);
  if(dm){
    const mi = MONTHS.indexOf(dm[1].slice(0,3).toLowerCase());
    if(mi >= 0){
      const y = new Date().getFullYear();
      let cand = `${y}-${pad(mi+1)}-${pad(+dm[2])}`;
      if(cand > addDays(today(),1)) cand = `${y-1}-${pad(mi+1)}-${pad(+dm[2])}`;
      day = cand; puzzle = `${dm[1]} ${dm[2]}`;
    }
    const seg = t.slice(dm.index + dm[0].length, fm.index);
    rounds = (seg.match(/\b\d{1,3}\b/g) || []).map(Number).filter(n => n <= 100).slice(0,5);
  }
  return {game:'maptap', puzzle, day, score, display: score+' / 1000', rounds, verified:true};
}
function parseCatfishing(t){
  if(!/🐈|🐟|catfishing/i.test(t)) return null;
  const m = t.match(/#(\d+)\s*[-–—]\s*(\d+(?:\.5)?)\s*\/\s*10/);
  if(!m) return null;
  const s = parseFloat(m[2]);
  return {game:'catfishing', puzzle:'#'+m[1], day:today(), score:s, display:s+'/10', verified:true};
}
function parseQuordle(t){
  const m = t.match(/Quordle\s*#?\s*(\d+)/i);
  if(!m) return null;
  const rest = t.slice(m.index + m[0].length);
  const digits = [...rest.matchAll(/([1-9])\uFE0F?\u20E3/g)].map(x => +x[1]);
  const misses = [...rest].filter(c => c === '🟥').length;
  if(digits.length + misses < 4) return {game:'quordle', error:"Recognised Quordle, but couldn't read all four words."};
  const score = digits.slice(0,4).reduce((a,b)=>a+b,0) + Math.min(misses, 4-Math.min(4,digits.length))*10;
  return {game:'quordle', puzzle:'#'+m[1], day:today(), score, display:`${digits.slice(0,4).join('-')}${misses?' + '+misses+' missed':''}`, verified:false};
}
function parseOctordle(t){
  const m = t.match(/Octordle\s*#?\s*(\d+)/i);
  if(!m) return null;
  const sc = t.match(/Score:\s*(\d+)/i);
  if(!sc) return {game:'octordle', error:"Recognised Octordle, but couldn't find its Score line."};
  return {game:'octordle', puzzle:'#'+m[1], day:today(), score:+sc[1], display:'Score '+sc[1], verified:false};
}
function parseGeneric(t){
  const low = t.toLowerCase();
  const g = GAMES.find(x => x.keys && x.keys.some(k => low.includes(k)));
  if(!g) return null;
  const pm = t.match(/#\s?(\d[\d,]*)/);
  const puzzle = pm ? '#'+pm[1] : '';
  const fr = t.replace(/#\s?\d[\d,]*/,'').match(/(\d[\d,]*|X)\s*\/\s*(\d[\d,]*)/i);
  let score = null, display = '';
  if(fr){
    const v = fr[1].toUpperCase()==='X' ? (g.fail || +fr[2].replace(/,/g,'')+1) : +fr[1].replace(/,/g,'');
    score = v; display = `${fr[1]}/${fr[2]}`;
  } else if(!g.higher){
    const sq = [...t].filter(c => '🟥🟩⬛⬜🟨🟧'.includes(c));
    if(sq.length){
      const i = sq.indexOf('🟩');
      score = i >= 0 ? i+1 : g.fail;
      display = i >= 0 ? `${i+1} ${i===0?'try':'tries'}` : 'Missed';
    }
  } else {
    const nums = (t.match(/\d[\d,]*/g) || []).map(s => +s.replace(/,/g,'')).filter(n => !isNaN(n) && n <= g.max);
    if(nums.length){ score = Math.max(...nums); display = score.toLocaleString(); }
  }
  if(score === null) return {game:g.id, error:`Recognised ${g.name}, but couldn't find a score in it.`};
  return {game:g.id, puzzle, day:today(), score, display, verified:false};
}
function parseResult(text){
  const t = text.trim();
  if(!t) return null;
  return parseWordle(t) || parseMapTap(t) || parseCatfishing(t) || parseQuordle(t) || parseOctordle(t) || parseGeneric(t)
      || {error:"That doesn't look like a result from any game on the board yet."};
}

/* ---------- Scoring ---------- */
// Percent of the best possible score, 0-100.
function pctMax(gid, s){
  const g = G[gid];
  const v = g.higher ? s / g.max * 100 : (g.fail - s) / (g.fail - (g.best || 1)) * 100;
  return Math.max(0, Math.min(100, Math.round(v)));
}
function better(g, a, b){ return G[g].higher ? a > b : a < b; }
// Percentile among everyone who played this game that day: 100 = best, 0 = worst.
function pct(entries, g, s){
  const n = entries.length; if(n <= 1) return 100;
  let worse = 0, equal = 0;
  for(const e of entries){ if(better(g, s, e)) worse++; else if(e === s) equal++; }
  return Math.round((worse + 0.5*(equal-1)) / (n-1) * 100);
}
// Points per game: your percentile among everyone who played it today (100 = best).
// With fewer than 3 players a percentile means little, so it falls back to % of the best possible score.
const MIN_FOR_PCT = 3;
function points(gid, score, byGame){
  const list = (byGame[gid] || []).map(x => x.e.score);
  return list.length >= MIN_FOR_PCT ? pct(list, gid, score) : pctMax(gid, score);
}
// Scores every player's games for a day. Each game is worth up to 100 points and the day's
// total is their sum, so playing more games and playing them well both move you up.
function dayData(day){
  const pool = boardPlayers(), byGame = {};
  for(const [id,p] of Object.entries(pool)){
    const r = (p.results||{})[day] || {};
    for(const [g,e] of Object.entries(r)){ if(G[g] && e) (byGame[g] ||= []).push({id, e}); }
  }
  // Place within each game, best first.
  for(const [g, list] of Object.entries(byGame)){
    list.sort((a,b) => better(g, a.e.score, b.e.score) ? -1 : better(g, b.e.score, a.e.score) ? 1 : 0);
    placesOf(list, x => x.e.score).forEach((p, i) => list[i].place = p);
  }
  for(const [g, list] of Object.entries(byGame)) list.forEach(x => x.v = points(g, x.e.score, byGame));
  const rows = [];
  for(const id of Object.keys(pool)){
    const r = (pool[id].results||{})[day] || {};
    const games = {}; let total = 0;
    for(const g of GAMES){
      const e = r[g.id]; if(!e) continue;
      const list = byGame[g.id], mineHere = list.find(x => x.id === id), v = points(g.id, e.score, byGame);
      games[g.id] = {v, e, place: mineHere.place, of: list.length}; total += v;
    }
    const played = Object.keys(games).length;
    if(played) rows.push({id, games, played, total, avg: Math.round(total / played)});
  }
  rows.sort((a,b) => b.total - a.total || b.avg - a.avg);
  return {rows, all: rows, byGame, places: placesOf(rows, r => r.total)};
}

const SHARE_URL = '';
const MEDALS = ['🥇','🥈','🥉'];
const SHARE_TOP = 10;
// Builds share text for the day's standings, like the result text the games themselves share.
function shareText(rows, places, byGame, day){
  const d = new Date(day+'T12:00:00').toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
  const g = currentGroup(), lines = [`trivialRANKS · ${g ? g.name + ' · ' : ''}${d}`, ''];
  const line = i => `${MEDALS[places[i]-1] || places[i] + '.'} ${nameOf(rows[i].id)} ${rows[i].total} · ${rows[i].played} game${rows[i].played === 1 ? '' : 's'}`;
  rows.slice(0, SHARE_TOP).forEach((_, i) => lines.push(line(i)));
  const myAt = rows.findIndex(r => r.id === uid);
  if(myAt >= SHARE_TOP) lines.push('…', line(myAt));
  else if(rows.length > SHARE_TOP) lines.push(`…and ${rows.length - SHARE_TOP} more`);
  const top = Object.entries(byGame).sort((a,b) => b[1].length - a[1].length)[0];
  if(top && top[1].length > 1) lines.push('', `Most played: ${G[top[0]].name} (${top[1].length})`);
  if(SHARE_URL) lines.push('', SHARE_URL);
  return lines.join('\n');
}

// Every day the player has results, newest first, each with its levels and points (% of max).
function myDays(id){
  const res = (players[id] && players[id].results) || {};
  return Object.keys(res).sort().reverse().map(day => ({day, row: dayData(day).rows.find(r => r.id === id)})).filter(x => x.row);
}
// A streak counts days with at least one game logged.
function streaks(days){
  const done = new Set(days.map(d => d.day));
  let cur = 0, d = today();
  if(!done.has(d)) d = addDays(d, -1);
  while(done.has(d)){ cur++; d = addDays(d, -1); }
  let best = 0, run = 0, prev = null;
  [...done].sort().forEach(x => { run = prev && addDays(prev, 1) === x ? run + 1 : 1; best = Math.max(best, run); prev = x; });
  return {cur, best};
}

function renderStats(){

  const avgDay = days.length ? Math.round(days.reduce((a,d) => a + d.row.total, 0) / days.length) : 0;

  const top = Math.max(200, Math.ceil(Math.max(0, ...span.map(d => byDay[d] ? byDay[d].total : 0)) / 200) * 200);
  const W = 360, H = 120, X0 = 28, bw = (W - X0) / 30;
  let chart = `<svg viewBox="0 -8 ${W} ${H + 26}" width="100%" role="img" aria-label="Daily points, last 30 days">`;
  for(const g of [top/2, top]) chart += `<line x1="${X0}" x2="${W}" y1="${H - g/top*H}" y2="${H - g/top*H}" stroke="var(--grid)"/><text x="0" y="${H - g/top*H + 3}" font-size="9" fill="var(--faint)">${g}</text>`;
  span.forEach((d,i) => {
    const r = byDay[d], x = X0 + i * bw + 1.5;
    if(r){ const h = Math.max(3, r.total / top * H); chart += `<rect x="${x.toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw-3).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent)"><title>${d}: ${r.total} pts, ${r.played} game${r.played===1?'':'s'}</title></rect>`; }

    case 'maptap': { const v = Math.round(600 + q*390); return {score:v, display:v+' / 1000'}; }
    case 'framed': case 'bandle': { const g = tries([.88,.72,.58,.46,.35,.25], 7); return {score:g, display: g===7 ? 'Missed' : g+(g===1?' try':' tries')}; }
    case 'catfishing': { const v = Math.round(q*20)/2; return {score:v, display:v+'/10'}; }
    case 'timeguessr': { const v = Math.round(15000 + q*34000); return {score:v, display:v.toLocaleString()+'/50,000'}; }
    case 'krillion': { const v = Math.round(150 + q*500); return {score:v, display:v+' points'}; }
    case 'immaculate': { const v = Math.max(0, Math.min(9, Math.round(q*9))); return {score:v, display:v+'/9'}; }
  }
  const g = G[gid];
  if(g.higher){ const v = Math.round(q * g.max); return {score:v, display:v+'/'+g.max}; }
  const v = Math.round(g.fail - q * (g.fail - (g.best || 1)));
  return {score:v, display: v >= g.fail ? 'X' : String(v)};
}
function makeDemo(){
  const out = {}, t = today();
  DEMO_PLAYERS.forEach((pl, pi) => {
    const r = seeded(pi * 7919 + 17), results = {};
    const pool = [...new Set([...pl.today, ...DEMO_POPULAR])];
    for(let d = 0; d < 30; d++){
      const day = addDays(t, -d);
      let games;
      if(d === 0) games = pl.today;
      else {
        if(r() > .88) continue;  // took the day off
        games = pool.slice(0, Math.max(1, pl.n + Math.round((r() - .5) * 4)));
      }
      results[day] = {};
      for(const g of games){
        const q = Math.max(0, Math.min(1, pl.skill + (r() - .5) * .45));
        results[day][g] = fakeResult(g, q);
      }
    }
    out[pl.id] = {name: pl.name, results};
  });
  return out;
}
function toggleDemo(){
  if(!demo){
    live = {players, uid, ready}; players = makeDemo(); ready = false; demo = true; uid = 'd-you';
    players['d-you'].name = (live.players[live.uid] && live.players[live.uid].name) || load('name') || 'You';
  }
  else { players = live.players; uid = live.uid; ready = live.ready; demo = false; }
  viewing = null; render();
}
// The sample-group preview is hidden; add ?sample to the address to show it again.
const SHOW_SAMPLE = /[?&]sample\b/.test(location.search);
function renderDemoBar(){
  const bar = $('demoBar');
  bar.style.display = SHOW_SAMPLE || demo ? 'flex' : 'none';
  if(!SHOW_SAMPLE && !demo) return;
  bar.style.background = demo ? 'var(--notice)' : '';
  bar.style.borderColor = demo ? 'var(--notice-line)' : '';
  bar.innerHTML = demo
    ? `<div class="grow"><div class="name">${esc(DEMO_GROUP)} <span class="badge beta">sample</span></div><div class="sub">${DEMO_PLAYERS.length} made-up members · nothing here is saved</div></div><button class="btn ghost" id="demoBtn">Back to live board</button>`
    : `<div class="grow sub">Want to see how a busy group looks?</div><button class="btn ghost" id="demoBtn">Preview a sample group</button>`;
  $('demoBtn').onclick = toggleDemo;
}

function renderHeader(){
  renderDemoBar();
  $('dateLine').textContent = prettyDay(today());
  setConnText();
  $('nameChip').style.cssText = page === 'profile' ? 'background:var(--accent);color:#fff' : '';
  $('statsBtn').style.cssText = page === 'stats' ? 'background:var(--accent);color:#fff' : '';
  $('nameBox').hidden = !(ready && !(me() && me().name) && !load('name'));
  renderJoin(); renderBoards();
}

function render(){
  renderHeader();
  showPage(!!page);
  if(page){
    $('page').innerHTML = page === 'profile' ? renderProfile() : page === 'group' ? renderGroup() : renderStats();
    $('pageBack').onclick = () => page === 'group' ? (page = 'profile', render()) : openPage(page);
    wireTheme(); wireGroups();
    if($('profSave')) $('profSave').onclick = async () => {
      const n = $('profName').value.trim().slice(0,24); if(!n) return;
      store('name', n);
      if(ready){ try{ const ref = db.doc('players/'+uid); if(me()) await ref.update({name:n}); else await ref.set({name:n, results:{}}); }catch(e){} }
      render();
    };
    return;
  }
  const t = today(), {rows, byGame, places} = dayData(t);
  if(!viewing || !rows.find(r => r.id === viewing)) viewing = rows.find(r => r.id === uid) ? uid : (rows[0] || {}).id;
  const vr = rows.find(r => r.id === viewing);

  /* Today: standings, games others played that you haven't, then one player's day */
  let h = `<div class="card"><div class="row between"><h2 style="margin:0">Today's standings</h2>${rows.length ? `<button class="chip" id="shareBtn" aria-label="Share today's standings"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Share</button>` : ''}</div>
    <div id="shareOut" hidden style="margin-top:8px"><div class="sub"></div><pre style="white-space:pre-wrap;user-select:all;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 0;font:12.5px/1.45 ui-monospace,Menlo,monospace"></pre></div>`;
  h += rows.length ? `<div class="list" style="margin-top:6px">` + rows.map((r, i) => `
      <div class="li click ${r.id===uid?'me':''} ${r.id===viewing?'sel':''}" data-view="${esc(r.id)}">
        <div class="rank ${places[i]===1?'r1':''}">${places[i]}</div>
        <div class="grow"><div class="name">${esc(nameOf(r.id))}</div>${stack(r, rows[0].total)}</div>
        <div style="text-align:right"><div class="score">${r.total}<span class="sub"> pts</span></div><div class="sub">${r.played} game${r.played===1?'':'s'} · avg ${r.avg}</div></div>
      </div>`).join('') + `</div>` + stackLegend(rows)
    : `<div class="empty">No results yet today. Play a game and paste your result above.</div>`;
  h += `<div class="hint">Ranked by total points. Each game is worth up to 100: your place among everyone who played it today (100 = best), or % of the best possible score when fewer than ${MIN_FOR_PCT} played it. Bars show each player's total, split by game. Tap a player to see their day.</div></div>`;

  const todo = GAMES.filter(g => byGame[g.id] && !byGame[g.id].some(x => x.id === uid))
    .sort((a,b) => byGame[b.id].length - byGame[a.id].length);
  if(todo.length) h += `<div class="card"><h2>${uid && vr && rows.some(r => r.id === uid) ? 'Others played these' : 'Played today'}</h2><div class="list">` + todo.map(g => {
      const list = byGame[g.id], best = list[0];
      return `<div class="game"><div class="dot todo" style="color:${gameColor(g.id)}">${esc(g.name[0])}</div>
        <div class="grow"><div class="name">${esc(g.name)}</div>
          <div class="sub">${esc(namesOf(list.map(x => x.id)))} · best ${esc(best.e.display)}</div></div>
        <a class="play" href="${g.url}" target="_blank" rel="noopener" data-game="${g.id}">Play ↗</a></div>`;
    }).join('') + `</div></div>`;

  if(vr){
    const place = places[rows.indexOf(vr)];
    h += `<div class="card">
      <div class="row between"><h2 style="margin:0">${vr.id === uid ? 'Your day' : esc(nameOf(vr.id)) + "'s day"}</h2>${vr.id !== uid && rows.find(r => r.id === uid) ? '<button class="chip" id="backToMe">← Back to you</button>' : ''}</div>
      <div class="sub" style="margin-top:2px">${ord(place)} of ${rows.length} · ${vr.total} pts from ${vr.played} game${vr.played===1?'':'s'}</div>
      ${dayList(vr, byGame)}</div>`;
  }
  $('tab-today').innerHTML = h;
  document.querySelectorAll('[data-view]').forEach(el => el.onclick = () => { viewing = el.dataset.view; render(); });
  if($('backToMe')) $('backToMe').onclick = () => { viewing = uid; render(); };
  if($('shareBtn')) $('shareBtn').onclick = () => shareStandings(shareText(rows, places, byGame, t));

  /* Games: every game by category, with who has played it today */
  const mine = (me() && me().results && me().results[t]) || {};
  let gh = `<div class="card">`;
  for(const cat of CATS){
    const gs = GAMES.filter(g => g.cat === cat.id), done = gs.filter(g => mine[g.id]).length;
    gh += `<div class="catblock" style="border-color:${cat.color}"><div class="row between"><h3 style="color:${cat.color}">${esc(cat.name)}</h3><span class="sub">${done ? done + ' of ' + gs.length + ' played' : ''}</span></div>` + gs.map(g => {
      const e = mine[g.id], others = (byGame[g.id] || []).filter(x => x.id !== uid).map(x => x.id);
      return `<div class="game"><div class="dot ${e?'':'todo'}" style="background:${cat.color};color:${e?'#fff':cat.color}">${e?'✓':esc(g.name[0])}</div>
        <div class="grow"><div class="name">${esc(g.name)} ${g.verified?'':'<span class="badge beta">beta</span>'}</div>
          <div class="sub">${[e ? esc(e.display) : '', others.length ? esc(namesOf(others)) + ' played today' : ''].filter(Boolean).join(' · ')}</div></div>
        <a class="play ${e?'done':''}" href="${g.url}" target="_blank" rel="noopener" data-game="${g.id}">${e?'Open':'Play'} ↗</a></div>`;
    }).join('') + `</div>`;
  }
  gh += `<div class="hint">Every game counts toward your total. Games open in a new tab; when you finish, tap the game's Share button and paste here.</div></div>`;
  $('tab-games').innerHTML = gh;
  document.querySelectorAll('a.play, a.spoke').forEach(a => a.onclick = () => { store('launch:'+a.dataset.game+':'+today(), new Date().toISOString()); });

  /* Week: total points over the last 7 days */
  const agg = {};
  for(const d of [...Array(7)].map((_,i) => addDays(t,-i))){
    for(const r of dayData(d).rows){ const a = agg[r.id] ||= {id:r.id, total:0, games:0, days:0}; a.total += r.total; a.games += r.played; a.days++; }
  }
  const wk = Object.values(agg).sort((a,b) => b.total - a.total || b.days - a.days), wp = placesOf(wk, r => r.total);
  $('tab-week').innerHTML = `<div class="card"><h2>Last 7 days</h2>` + (wk.length ? `<div class="list">` + wk.map((r,i) => `
      <div class="li ${r.id===uid?'me':''}"><div class="rank ${wp[i]===1?'r1':''}">${wp[i]}</div>
        <div class="grow"><div class="name">${esc(nameOf(r.id))}</div><div class="sub">${r.games} game${r.games===1?'':'s'} over ${r.days} day${r.days===1?'':'s'}</div></div>
        <div style="text-align:right"><div class="score">${r.total}<span class="sub"> pts</span></div><div class="sub">avg ${Math.round(r.total / r.days)} a day</div></div></div>`).join('') + `</div>
      <div class="hint">Total points from every game logged this week.</div>` : `<div class="empty">Nobody has played this week yet.</div>`) + `</div>`;
  const collapsed = Object.keys(mine).length > 0 && !pasteOpen && !box.value && $('confirm').hidden;
  $('pasteBody').hidden = collapsed; $('pasteOpen').hidden = !collapsed;
  $('pasteOpen').onclick = () => { pasteOpen = true; render(); box.focus(); };

  if(!$('confirm').hidden && pending) showConfirm(pending, $('confirm')._raw);
}

/* ---------- Groups (hosted site only; claude.ai has no 'groups', so these stay hidden there) ---------- */
// board: 'all' for the global board, or a group id. Results live on each player, so a group
// is just who you're compared with: points are worked out among the group's members.
let groupsApi = null, groups = [], board = load('board') || 'all', joinOffer = null, groupOpen = null, groupFlash = '';
const currentGroup = () => (board !== 'all' && groups.find(g => g.id === board)) || null;
function boardPlayers(){
  const g = currentGroup(); if(!g || demo) return players;
  const ids = new Set(g.members.map(m => m.id));
  return Object.fromEntries(Object.entries(players).filter(([id]) => ids.has(id)));
}
function pickBoard(id){ board = id; store('board', id); viewing = null; }
async function loadGroups(){
  if(!groupsApi || !uid) return;
  try{
    groups = await groupsApi.list();
    if(board !== 'all' && !groups.some(g => g.id === board)) pickBoard('all');
  }catch(e){}
}

// Invite links look like …/?join=K7Q2MXH4PA. Keep the code until it's used: signing in by
// email reloads the page without it.
const JOIN_IN_URL = (location.search.match(/[?&]join=([A-Za-z0-9]{4,16})/) || [])[1];
if(JOIN_IN_URL){ store('joinCode', JOIN_IN_URL.toUpperCase()); history.replaceState(null, '', location.pathname); }
async function offerJoin(){
  const code = load('joinCode'); if(!code || !groupsApi) return;
  let p; try{ p = await groupsApi.preview(code); }catch(e){ return; }
  if(!p){ joinOffer = {bad: true}; return; }
  if(p.member){ store('joinCode'); joinOffer = null; pickBoard(p.id); return; }
  joinOffer = {code, ...p};
}
function renderJoin(){
  const c = $('joinCard'), o = joinOffer;
  c.hidden = !o || !!page || demo; if(c.hidden) return;
  const dismiss = () => { store('joinCode'); joinOffer = null; render(); };
  if(o.bad){
    c.innerHTML = `<div class="row between"><div class="meta">That invite link doesn't work anymore. Ask for a new one.</div><button class="btn ghost" id="joinNo">OK</button></div>`;
  } else if(!uid){
    c.innerHTML = `<h2>You're invited to ${esc(o.name)}</h2><div class="meta">${o.members} player${o.members===1?'':'s'}. Sign in at the bottom of the page and you can join.</div>`;
  } else {
    c.innerHTML = `<h2>Join ${esc(o.name)}?</h2><div class="meta">${o.members} player${o.members===1?'':'s'}. You'll still be on the global board too.</div>
      <div class="row" style="margin-top:12px"><button class="btn grow" id="joinYes">Join group</button><button class="btn ghost" id="joinNo">No thanks</button></div><div class="hint" id="joinMsg"></div>`;
    $('joinYes').onclick = async () => {
      $('joinYes').disabled = true;
      try{ const g = await groupsApi.join(o.code); store('joinCode'); joinOffer = null; await loadGroups(); pickBoard(g.id); render(); }
      catch(e){ $('joinMsg').textContent = e.message || "Couldn't join, try again."; $('joinMsg').style.color = 'var(--warm)'; $('joinYes').disabled = false; }
    };
  }
  if($('joinNo')) $('joinNo').onclick = dismiss;
}
// Board picker above the tabs: Everyone, each group, and a shortcut to start one.
function renderBoards(){
  const bar = $('boardBar'), show = !page && !demo && !!groupsApi && !!uid;
  bar.hidden = !show; if(!show) return;
  bar.innerHTML = [{id: 'all', name: 'Everyone'}, ...groups].map(g =>
    `<button class="chip ${board === g.id ? 'on' : ''}" data-board="${esc(g.id)}">${esc(g.name)}</button>`).join('')
    + `<button class="chip add" id="boardAdd">+ ${groups.length ? 'Group' : 'Start a group'}</button>`;
  bar.querySelectorAll('[data-board]').forEach(b => b.onclick = () => { pickBoard(b.dataset.board); render(); });
  $('boardAdd').onclick = () => { page = 'profile'; window.scrollTo(0,0); render(); setTimeout(() => $('groupName') && $('groupName').focus(), 0); };
}

const inviteLink = g => location.origin + location.pathname + '?join=' + g.code;
async function shareInvite(g){
  const url = inviteLink(g), text = `Join my trivialRANKS group "${g.name}": ${url}`;
  if(matchMedia('(pointer:coarse)').matches && navigator.share){
    try{ await navigator.share({text}); return; }catch(e){ if(e && e.name === 'AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(url); say('Invite link copied. Anyone with it can join.'); }
  catch(e){ say('Copy this link to invite people: ' + url); }
}
function say(text, warn){ const m = $('groupMsg'); if(m){ m.textContent = text; m.style.color = warn ? 'var(--warm)' : ''; } }
// Runs a group change, reloads the list, and shows any error from the database (already worded for people).
async function groupAction(fn, done){
  say('Working…');
  try{ const r = await fn(); await loadGroups(); if(done) done(r); render(); if(groupFlash){ say(groupFlash); groupFlash = ''; } }
  catch(e){ say((e && e.message) || 'Something went wrong. Try again.', true); }
}

function groupsCard(){
  if(demo) return `<div class="card"><h2>Groups</h2><div class="list"><div class="li"><div class="grow name">${esc(DEMO_GROUP)} (sample)</div></div></div></div>`;
  if(!groupsApi) return `<div class="card"><h2>Groups</h2><div class="hint" style="margin-top:0">Groups are on the hosted site.</div></div>`;
  if(!uid) return `<div class="card"><h2>Groups</h2><div class="hint" style="margin-top:0">Sign in to start or join a group.</div></div>`;
  return `<div class="card"><h2>Groups</h2>
    ${groups.length ? `<div class="list">` + groups.map(g => `<div class="li"><div class="grow"><div class="name">${esc(g.name)}</div>
        <div class="sub">${g.members.length} player${g.members.length===1?'':'s'}${g.role === 'owner' ? ' · you run it' : ''}</div></div>
        <button class="chip" data-invite="${esc(g.id)}">Invite</button><button class="chip" data-manage="${esc(g.id)}" style="background:var(--chip);color:var(--muted)">Manage</button></div>`).join('') + `</div>` : ''}
    <div class="row namebox" style="margin-top:${groups.length ? 12 : 0}px"><input id="groupName" maxlength="40" placeholder="New group name, e.g. Trivia Night"><button class="btn" id="groupCreate">Create</button></div>
    <div class="hint" id="groupMsg">${groups.length ? '' : 'Start a group and share its invite link. '}Everyone is still on the global board too.</div></div>`;
}
function renderGroup(){
  const g = groups.find(x => x.id === groupOpen);
  if(!g) return backBar('Group') + `<div class="card"><div class="empty">You're not in this group anymore.</div></div>`;
  const owner = g.role === 'owner', alone = g.members.length === 1;
  return backBar(esc(g.name)) + `
  <div class="card"><h2>Invite people</h2>
    <input readonly value="${esc(inviteLink(g))}" onclick="this.select()" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:13px ui-monospace,Menlo,monospace;background:var(--field);color:var(--ink)">
    <div class="row" style="margin-top:10px;gap:8px"><button class="btn grow" id="gShare">Share invite link</button>${owner ? '<button class="btn ghost" id="gReset">New link</button>' : ''}</div>
    <div class="hint" id="groupMsg">Anyone with the link can join.${owner ? ' A new link stops the old one working.' : ''}</div></div>
  <div class="card"><h2>Players · ${g.members.length}</h2><div class="list">` + g.members.map(m => `
    <div class="li ${m.id===uid?'me':''}"><div class="grow"><div class="name">${esc(players[m.id] ? nameOf(m.id) : 'New player')}</div>
      <div class="sub">${m.role === 'owner' ? 'Runs the group · ' : ''}joined ${new Date(m.joinedAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div></div>
      ${owner && m.id !== uid ? `<button class="chip" data-remove="${esc(m.id)}" style="background:var(--warm-soft);color:var(--warm)">Remove</button>` : ''}</div>`).join('') + `</div></div>
  ${owner ? `<div class="card"><h2>Rename</h2><div class="row namebox"><input id="gName" maxlength="40" value="${esc(g.name)}"><button class="btn" id="gRename">Save</button></div></div>` : ''}
  <div class="card"><button class="btn ghost" id="gLeave" style="width:100%;color:var(--warm);border-color:var(--warm)">Leave group</button>
    <div class="hint">${alone ? "You're the only player, so leaving deletes the group." : owner ? 'If you leave, the longest-standing player takes over the group.' : 'You can rejoin with an invite link.'}</div></div>`;
}
function wireGroups(){
  const on = (id, fn) => { if($(id)) $(id).onclick = fn; };
  on('groupCreate', () => {
    const name = $('groupName').value.trim(); if(!name) return $('groupName').focus();
    groupAction(() => groupsApi.create(name), g => { pickBoard(g.id); groupOpen = g.id; page = 'group'; groupFlash = 'Group created. Share the link to invite people.'; });
  });
  if($('groupName')) $('groupName').onkeydown = e => { if(e.key === 'Enter') $('groupCreate').click(); };
  document.querySelectorAll('[data-invite]').forEach(b => b.onclick = () => shareInvite(groups.find(g => g.id === b.dataset.invite)));
  document.querySelectorAll('[data-manage]').forEach(b => b.onclick = () => { groupOpen = b.dataset.manage; page = 'group'; window.scrollTo(0,0); render(); });
  const g = page === 'group' && groups.find(x => x.id === groupOpen); if(!g) return;
  on('gShare', () => shareInvite(g));
  on('gReset', () => { if(confirm('Make a new invite link? The current link will stop working.')) groupAction(() => groupsApi.resetCode(g.id), () => { groupFlash = 'New link ready. The old one no longer works.'; }); });
  on('gRename', () => groupAction(() => groupsApi.rename(g.id, $('gName').value), () => { groupFlash = 'Renamed.'; }));
  on('gLeave', () => { if(confirm(`Leave ${g.name}?`)) groupAction(() => groupsApi.leave(g.id), () => { page = 'profile'; if(board === g.id) pickBoard('all'); }); });
  document.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => {
    const id = b.dataset.remove; if(confirm(`Remove ${players[id] ? nameOf(id) : 'this player'} from ${g.name}?`)) groupAction(() => groupsApi.remove(g.id, id));
  });
}

/* ---------- Connect to the shared board ---------- */
let connState = ['Connecting…', false];
function setConn(text, warn){ connState = [text, warn]; setConnText(); }
function setConnText(){ const c = $('conn'), [text, warn] = demo ? ['Sample group', false] : connState; c.textContent = text; c.className = 'status' + (warn ? ' warn' : ''); }
async function resolveNames(){
  if(!user || !user.profiles) return;
  try{ const ids = Object.keys(players); if(ids.length) profiles = await user.profiles(ids) || {}; }catch(e){}
}
render();
(async () => {
  if(!window.claude || !window.claude.use){ setConn('Not connected', false); return; }
  try{ user = await window.claude.use('user'); }catch(e){}
  try{ db = await window.claude.use('db'); }catch(e){}
  try{ groupsApi = await window.claude.use('groups'); }catch(e){}
  if(user){ try{ uid = await user.id(); }catch(e){} }
  await offerJoin();
  if(!db || !uid){ setConn('Sign in to save', true); render(); return; }
  await loadGroups();
  const timer = setTimeout(() => setConn('Still connecting…', true), 10000);
  db.collection('players').onSnapshot(async snap => {
    const fresh = {}; snap.docs.forEach(d => { if(d.exists) fresh[d.id] = d.data(); });
    if(demo) live.players = fresh; else players = fresh;
    if(!snap.metadata.fromCache){ clearTimeout(timer); if(demo) live.ready = true; else ready = true; const n = Object.keys(fresh).length; setConn(n + ' player' + (n===1?'':'s')); }
    await resolveNames(); render();
  }, () => { clearTimeout(timer); setConn('Board unavailable', true); });
})();
document.addEventListener('visibilitychange', async () => { if(document.hidden) return; render(); await loadGroups(); render(); });
</script>
